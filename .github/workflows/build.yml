name: "Build SUSFS kernel"

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU tag (SUSFS kernel-4.19 patch targets v1.0.3)"
        default: "v1.0.3"
        required: false
      kernel_repo:
        description: "kernel source repo"
        default: "https://github.com/Rinko-Studio/android_kernel_xiaomi_thyme"
        required: false
      kernel_branch:
        description: "kernel source branch"
        default: "thirteen"
        required: false
      defconfig:
        description: "defconfig file name"
        default: "thyme_defconfig"
        required: false

jobs:
  build:
    name: "Build thyme + KernelSU + SUSFS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev \
            lz4 zstd wget libfl-dev python3 libarchive-tools flex bison \
            device-tree-compiler patch cpio

      - name: Clone kernel source
        run: |
          git clone --recursive --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel --depth=1
          cd kernel
          echo "HEAD: $(git log --oneline -1)"
          ls arch/arm64/configs/${{ inputs.defconfig }}

      - name: Get toolchain (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          ./proton-clang/bin/clang --version | head -2

      - name: Drop legacy KernelSU (drivers/staging/ksu)
        working-directory: ./kernel
        run: |
          # the tree ships an ancient KernelSU at drivers/staging/ksu that also
          # keys off CONFIG_KSU -> duplicate symbols vs drivers/kernelsu
          rm -rf drivers/staging/ksu
          grep -v 'ksu/' drivers/staging/Makefile > /tmp/mk && mv /tmp/mk drivers/staging/Makefile
          grep -v 'staging/ksu' drivers/staging/Kconfig > /tmp/kc && mv /tmp/kc drivers/staging/Kconfig
          echo "--- staging/Makefile ksu lines (should be empty) ---"
          grep -n 'ksu' drivers/staging/Makefile || true
          echo "--- staging/Kconfig ksu lines (should be empty) ---"
          grep -n 'ksu' drivers/staging/Kconfig || true

      - name: Clone KernelSU (${{ inputs.ksu_tag }})
        working-directory: ./kernel
        run: |
          git clone --branch "${{ inputs.ksu_tag }}" --depth=200 \
            https://github.com/tiann/KernelSU KernelSU
          cd KernelSU
          echo "KernelSU HEAD: $(git log --oneline -1)"
          git config user.email "ci@localhost"
          git config user.name "ci"
          git revert --no-commit 898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899 || echo "::warning::revert commit skipped"
          cd ..
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Clone SUSFS and apply patches
        working-directory: ./kernel
        run: |
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/fs/sus_su.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/
          cp susfs_src/kernel_patches/include/linux/sus_su.h include/linux/
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          ( cd KernelSU && patch -p1 --forward --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch || true )
          patch -p1 --forward --no-backup-if-mismatch < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          echo "=== leftover rejects ==="
          find . -name "*.rej" -not -path "./susfs_src/*" | tee rejects.txt || true

      - name: Repair rejects (msm-4.19 tree differences)
        working-directory: ./kernel
        run: |
          cp ../fix_patches.py .
          python3 fix_patches.py
          echo "=== verify markers ==="
          grep -c susfs fs/Makefile
          grep -n "susfs_task_state" include/linux/sched.h | head -3
          grep -n "susfs_def.h" fs/proc/task_mmu.c fs/readdir.c fs/notify/fdinfo.c | head -5
          grep -n "KSU_SUSFS" KernelSU/kernel/Kconfig | head -5

      - name: Append kernel config
        working-directory: ./kernel
        run: |
          cat >> arch/arm64/configs/${{ inputs.defconfig }} <<'EOF'

          # --- KernelSU + SUSFS ---
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          # CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS is not set
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          tail -20 arch/arm64/configs/${{ inputs.defconfig }}

      - name: Shim python2 for mkdtboimg
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python2
          python2 --version

      - name: Make defconfig
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/proton-clang/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc HOSTLD=ld HOSTAR=ar \
            ${{ inputs.defconfig }}
          grep -E "CONFIG_(KSU|KPROBES)" out/.config | head -25

      - name: Build kernel
        working-directory: ./kernel
        run: |
          # build Image only: dtbo.img needs python2, and we keep the stock dtbo
          make -j$(nproc) O=out ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/proton-clang/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc HOSTLD=ld HOSTAR=ar \
            Image

      - name: Verify Image
        working-directory: ./kernel
        run: |
          ls -l out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m3 "Linux version"
          echo "susfs strings: $(strings out/arch/arm64/boot/Image | grep -c susfs)"
          echo "kernelsu strings: $(strings out/arch/arm64/boot/Image | grep -c -i kernelsu)"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-thyme-susfs
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      - name: Upload rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejects
          path: |
            kernel/rejects.txt
            kernel/**/*.rej
          if-no-files-found: ignore
          retention-days: 7
