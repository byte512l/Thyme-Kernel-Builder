name: "Build SUSFS kernel"

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU tag (SUSFS patch targets v1.0.3)"
        default: "v1.0.3"
        required: false
      kernel_repo:
        description: "kernel source repo"
        default: "https://github.com/Rinko-Studio/android_kernel_xiaomi_thyme"
        required: false
      kernel_branch:
        description: "kernel source branch"
        default: "thirteen"
        required: false
      defconfig:
        description: "defconfig file name"
        default: "thyme_defconfig"
        required: false

env:
  KERNEL_DIR: kernel

jobs:
  build:
    name: "Build thyme + KernelSU + SUSFS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev \
            lz4 zstd wget libfl-dev python3 libarchive-tools flex bison \
            device-tree-compiler patch cpio

      - name: Clone kernel source
        run: |
          git clone --recursive --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" "$KERNEL_DIR" --depth=1
          cd "$KERNEL_DIR"
          echo "HEAD: $(git log --oneline -1)"
          ls arch/arm64/configs/${{ inputs.defconfig }}

      - name: Get toolchain (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          echo "$GITHUB_WORKSPACE/proton-clang/bin" >> $GITHUB_PATH
          "$GITHUB_WORKSPACE/proton-clang/bin/clang" --version | head -2

      - name: Clone KernelSU (${{ inputs.ksu_tag }})
        working-directory: ./kernel
        run: |
          git clone --branch "${{ inputs.ksu_tag }}" --depth=200 \
            https://github.com/tiann/KernelSU KernelSU
          cd KernelSU
          echo "KernelSU HEAD: $(git log --oneline -1)"
          git config user.email "ci@localhost"
          git config user.name "ci"
          git revert --no-commit 898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899 || echo "::warning::revert commit skipped"
          cd ..
          ln -sfn ../KernelSU drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "--- drivers/Makefile tail ---"; tail -3 drivers/Makefile
          echo "--- drivers/Kconfig tail ---"; tail -3 drivers/Kconfig

      - name: Clone SUSFS and apply patches
        working-directory: ./kernel
        run: |
          set -x
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/fs/sus_su.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/
          cp susfs_src/kernel_patches/include/linux/sus_su.h include/linux/
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          ( cd KernelSU && patch -p1 --forward --no-backup-if-mismatch -r - < 10_enable_susfs_for_ksu.patch || echo "::warning::KernelSU patch had rejects" )
          patch -p1 --forward --no-backup-if-mismatch -r - < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.19.patch || echo "::warning::kernel patch had rejects"
          echo "=== rejects ==="
          find . -name "*.rej" -not -path "./susfs_src/*" | tee /tmp/rejects.txt
          wc -l /tmp/rejects.txt
          echo "=== verify ==="
          ls -l fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h
          grep -c susfs fs/Makefile
          grep -rn "susfs" kernel/Kconfig | head -20 || true

      - name: Append kernel config
        working-directory: ./kernel
        run: |
          cat >> arch/arm64/configs/${{ inputs.defconfig }} <<'EOF'

          # --- KernelSU + SUSFS ---
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          tail -25 arch/arm64/configs/${{ inputs.defconfig }}

      - name: Make defconfig
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ inputs.defconfig }}
          grep -E "CONFIG_(KSU|KPROBES|KSU_SUSFS)" out/.config | head -30

      - name: Build kernel
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Verify Image
        working-directory: ./kernel
        run: |
          ls -l out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m3 "Linux version"
          echo "susfs symbols: $(strings out/arch/arm64/boot/Image | grep -c susfs)"
          echo "kernelsu symbols: $(strings out/arch/arm64/boot/Image | grep -c -i kernelsu)"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-thyme-susfs
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejects
          path: /tmp/rejects.txt
          if-no-files-found: ignore
          retention-days: 7
